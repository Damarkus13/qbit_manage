name: Sync Upstream & Build GHCR

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  push:
    branches:
      - develop
      - feature/deprioritize-queue
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: 'Attempt to merge upstream develop before building'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_upstream)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and merge upstream
        run: |
          git remote add upstream https://github.com/StuffAnThings/qbit_manage.git || true
          git fetch upstream develop
          # Attempt clean merge
          if git merge upstream/develop -m "chore(sync): auto-merge upstream/develop"; then
            git push origin HEAD
          else
            echo "Merge conflict encountered with upstream. Aborting auto-merge."
            git merge --abort
            exit 1
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: [sync-upstream]
    if: always() && (needs.sync-upstream.result == 'success' || needs.sync-upstream.result == 'skipped')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=develop
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
